# Opt-in local development overlay. Production continues to use compose.yaml alone.
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      azurite:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck --disableProductStyleUrl --disableTelemetry
    environment:
      AZURITE_ACCOUNTS: dottinlocal:${AZURITE_ACCOUNT_KEY:?Run the local environment initialization script}
    ports:
      - "${TOOLS_BIND_ADDRESS:-127.0.0.1}:32855:10000"
    volumes:
      - dottin-azurite:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(3000,()=>process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dottin-azurite:
