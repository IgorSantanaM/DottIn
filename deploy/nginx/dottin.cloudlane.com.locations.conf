# Include INSIDE the existing HTTPS server for dottin.cloudlane.com.
# Replace conflicting location blocks; keep your TLS certificate configuration.
# Keep the full URI: do NOT add a slash/path after the upstream port.
location = /api {
    proxy_pass http://127.0.0.1:32850;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:32850;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    proxy_pass http://127.0.0.1:32850;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
