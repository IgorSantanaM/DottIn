services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dottindb
      POSTGRES_USER: dottin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dottin-password}
    volumes:
      - dottin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dottin -d dottindb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/DottIn.Presentation.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DottInDb: Host=postgres;Port=5432;Database=dottindb;Username=dottin;Password=${POSTGRES_PASSWORD:-local-dottin-password}
      AllowedOrigins__0: http://localhost:8080
      Database__ApplyMigrationsOnStartup: "true"
      Stripe__SuccessUrl: http://localhost:8080/billing/success
      Stripe__CancelUrl: http://localhost:8080/billing/cancel
      Stripe__PortalReturnUrl: http://localhost:8080/billing
    depends_on:
      postgres:
        condition: service_healthy
  admin:
    build:
      context: .
      dockerfile: clients/DottIn.Admin/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  dottin-postgres:
