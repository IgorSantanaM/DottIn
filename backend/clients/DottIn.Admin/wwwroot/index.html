<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DottIn Admin</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="DottIn.Admin.styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0A0F1E;
            z-index: 9999;
            gap: 0;
            font-family: 'Inter', sans-serif;
        }

            #loading-screen::before {
                content: '';
                position: absolute;
                inset: 0;
                background-image: linear-gradient(rgba(37, 99, 235, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, 0.06) 1px, transparent 1px);
                background-size: 48px 48px;
                mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
            }

            #loading-screen::after {
                content: '';
                position: absolute;
                width: 320px;
                height: 320px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, transparent 70%);
                top: 50%;
                left: 50%;
                transform: translate(-50%, -60%);
                pointer-events: none;
            }

        .loading-logo-wrap {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 52px;
        }

        .loading-logo-mark {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.5), 0 8px 32px rgba(0,0,0,0.4);
            animation: logo-pulse 2.4s ease-in-out infinite;
        }

        @keyframes logo-pulse {
            0%, 100% {
                box-shadow: 0 0 40px rgba(37, 99, 235, 0.5), 0 8px 32px rgba(0,0,0,0.4);
            }

            50% {
                box-shadow: 0 0 64px rgba(37, 99, 235, 0.75), 0 8px 32px rgba(0,0,0,0.4);
            }
        }

        .loading-logo-mark svg {
            width: 30px;
            height: 30px;
            color: white;
        }

        .loading-wordmark {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .loading-wordmark-dot {
            font-size: 28px;
            font-weight: 700;
            color: #2563EB;
            letter-spacing: -0.5px;
        }

        .loading-wordmark-text {
            font-size: 28px;
            font-weight: 600;
            color: #F8FAFC;
            letter-spacing: -0.5px;
        }

        .loading-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: #64748B;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .loading-bar-track {
            position: relative;
            z-index: 1;
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #2563EB, #60A5FA);
            width: calc(var(--blazor-load-percentage, 0) * 1%);
            transition: width 0.1s ease;
            position: relative;
        }

            .loading-bar-fill::after {
                content: '';
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #93C5FD;
                box-shadow: 0 0 8px #60A5FA;
            }

        .loading-pct {
            position: relative;
            z-index: 1;
            font-size: 11px;
            color: #475569;
            margin-top: 12px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

            .loading-pct::after {
                content: var(--blazor-load-percentage-text, '0%');
            }

        .loading-dots {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 6px;
            margin-top: 32px;
        }

            .loading-dots span {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #2563EB;
                opacity: 0.3;
                animation: dot-bounce 1.4s ease-in-out infinite;
            }

                .loading-dots span:nth-child(2) {
                    animation-delay: 0.2s;
                }

                .loading-dots span:nth-child(3) {
                    animation-delay: 0.4s;
                }

        @keyframes dot-bounce {
            0%, 80%, 100% {
                opacity: 0.2;
                transform: scale(1);
            }

            40% {
                opacity: 1;
                transform: scale(1.35);
            }
        }

        #loading-screen.fade-out {
            animation: fade-out 0.4s ease forwards;
        }

        @keyframes fade-out {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-logo-wrap">
            <div class="loading-logo-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <polyline points="12 7 12 12 15.5 14" />
                </svg>
            </div>
            <div>
                <div class="loading-wordmark">
                    <span class="loading-wordmark-text">DottIn</span>
                </div>
                <div class="loading-subtitle">Painel Administrativo</div>
            </div>
        </div>

        <div class="loading-bar-track">
            <div class="loading-bar-fill"></div>
        </div>
        <div class="loading-pct"></div>

        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        Ocorreu um erro. <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        const app = document.getElementById('app');
        const screen = document.getElementById('loading-screen');

        const observer = new MutationObserver(() => {
            const pct = app.style.getPropertyValue('--blazor-load-percentage');
            const pctText = app.style.getPropertyValue('--blazor-load-percentage-text');

            if (pct) {
                screen.style.setProperty('--blazor-load-percentage', pct);
            }
            if (pctText) {
                screen.style.setProperty('--blazor-load-percentage-text', pctText);
            }

            if (app && app.children.length > 0) {
                if (screen && !screen.classList.contains('fade-out')) {
                    screen.classList.add('fade-out');
                    screen.addEventListener('animationend', () => screen.remove(), { once: true });
                    observer.disconnect();
                }
            }
        });

        observer.observe(app, {
            childList: true,
            attributes: true,
            attributeFilter: ['style']
        });
    </script>
</body>
</html>
