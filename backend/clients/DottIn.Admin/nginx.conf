# Preserve HTTPS when TLS terminates at the deployment host's reverse proxy.
map $http_x_forwarded_proto $dottin_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/octet-stream application/wasm text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location = /appsettings.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dottin_forwarded_proto;
    }

    # Keep /api in the upstream URI. A trailing slash on proxy_pass strips it.
    # ^~ also prevents API paths ending in .json/.csv/.js from hitting static rules.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dottin_forwarded_proto;
    }

    location = /webhook {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dottin_forwarded_proto;
    }

    location ^~ /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dottin_forwarded_proto;
    }

    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, no-transform";
        try_files $uri =404;
    }
}
