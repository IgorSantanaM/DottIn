name: Web CI

on:
  pull_request:
    paths:
      - "backend/src/**"
      - "backend/clients/DottIn.Admin/**"
      - "backend/tests/**"
      - "backend/DottIn.Web.slnx"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/clients/DottIn.Admin/**"
      - "backend/tests/**"
      - "backend/DottIn.Web.slnx"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore web solution
        run: dotnet restore backend/DottIn.Web.slnx

      - name: Build web solution
        run: dotnet build backend/DottIn.Web.slnx --configuration Release --no-restore

      - name: Test web solution
        run: dotnet test backend/DottIn.Web.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=web-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
